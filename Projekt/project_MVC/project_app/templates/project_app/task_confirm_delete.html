{% extends 'project_app/base.html' %}

{% block content %}
<h2>Delete task</h2>
<p>Are you sure you want to delete <strong>{{ task.description }}</strong>?</p>

<form method="post" novalidate>
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{{ task.get_absolute_url }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
