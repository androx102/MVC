{% extends 'project_app/base.html' %}

{% block content %}
<h2>Register</h2>

<form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Create account</button>
    <a href="{% url 'login' %}" class="btn btn-secondary">Have an account? Log in</a>
</form>
{% endblock %}
